name: test
on: [push, pull_request]
jobs:
  go:
    strategy:
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go test -v ./...
        working-directory: core
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test
        working-directory: web
  # 윈도우 프로그램: 실제 윈도우에서 테스트하고 exe까지 빌드해 본다(배포는 release.yml)
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: go test -v ./...
        working-directory: desktop
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -platform windows/amd64 -o hangul-name-fixer.exe -trimpath
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: hangul-name-fixer-exe, path: desktop/build/bin/hangul-name-fixer.exe, retention-days: 7 }
